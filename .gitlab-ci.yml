# .gitlab-ci.yml (snippet)
image: docker:27.3.1

variables:
  DOCKER_BUILDKIT: "1"
  DOCKERFILE_DIR: "src/cro_improvement_feature/network_analyzer"
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

before_script:
  - apk add --no-cache python3 py3-pip jq
  - pip install --no-cache-dir awscli
  - aws sts get-caller-identity
  - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
    | docker login --username AWS --password-stdin "$ECR_REGISTRY"

build-and-push:
  stage: build
  tags: ["docker"]
  script:
    - export IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
    - export TAG="${CI_COMMIT_SHORT_SHA}"
    - docker build -t "$IMAGE:$TAG" -f "$DOCKERFILE_DIR/Dockerfile.GitLab" "$DOCKERFILE_DIR"
    - docker push "$IMAGE:$TAG"

