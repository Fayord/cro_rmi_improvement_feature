image: docker:28-dind

services:
    - name: docker:28-dind

default:
  tags:
    - vision_vm

variables:
  DOCKERFILE_DIR: "src/cro_rmi_improvement_feature/network_analyzer"
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  DOCKER_TLS_CERTDIR: ""                # disable TLS so we can talk to DinD over plain TCP
  DOCKER_HOST: tcp://docker:2375        # point the Docker CLI at the DinD service
  DOCKER_DRIVER: overlay2

stages:
    - exploration
    - build_push

exploration:
    stage: exploration
    before_script:
        - apk add --no-cache tree
    script:
        - cd /mnt/data
        - ls -la
        - echo "=== Directory Tree Structure ==="
        - echo "=== Contents of /mnt/data ===" 
        - tree .

build_and_push:
    stage: build_push
    before_script:
        - apk add --no-cache aws-cli docker-cli jq
        - aws --version
        - docker --version
        - pwd
        - echo "$CI_PROJECT_DIR"
        - cd "$CI_PROJECT_DIR/$DOCKERFILE_DIR"
        # Copy data from mounted path
        - rm -rf data && mkdir -p data
        - cp -a /mnt/data/. data/
        - ls -la data | head -n 50
        - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    script:
        - docker version
        # Build the Docker image
        - docker build -f Dockerfile -t rmi-ai/ai-service .
        - docker tag rmi-ai/ai-service:latest 088342693028.dkr.ecr.ap-southeast-1.amazonaws.com/rmi-ai/ai-service:latest
        - echo "Built images:"
        - docker images | head -n 20
        # Push to ECR
        - docker push 088342693028.dkr.ecr.ap-southeast-1.amazonaws.com/rmi-ai/ai-service:latest
        - echo "Successfully pushed rmi-ai/ai-service to ECR"


